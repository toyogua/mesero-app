services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: mesero-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - mesero

  nginx:
    image: nginx:1.27-alpine
    container_name: mesero-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mesero

  mysql:
    image: mysql:8.0
    container_name: mesero-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mesero_app}
      MYSQL_USER: ${DB_USERNAME:-mesero}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mesero-mysql-data:/var/lib/mysql
    networks:
      - mesero

  redis:
    image: redis:7-alpine
    container_name: mesero-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - mesero

  reverb:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: mesero-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - ./:/var/www/html
    ports:
      - "8090:8080"
    depends_on:
      - app
    networks:
      - mesero

  mailpit:
    image: axllent/mailpit:latest
    container_name: mesero-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - mesero

networks:
  mesero:
    driver: bridge

volumes:
  mesero-mysql-data:
